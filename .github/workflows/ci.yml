name: Xiaoye CI

on:
  push:
    branches: ["master", "main", "feat/*"]
  pull_request:
    branches: ["master", "main"]

jobs:
  unit-test:
    name: Unit Tests (small + tools)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio pytest-cov

    - name: Run Unit Tests
      env:
        QWEN_API_KEY: "mock_api_key_for_ci"
        QWEN_BASE_URL: "http://localhost:8000"
        CELERY_BROKER_URL: "redis://localhost:6379/0"
        PYTHONPATH: ${{ github.workspace }}
      run: |
        python -m pytest tests/ -m "small or tools" --cov=src --cov-report=term-missing --cov-report=xml -v

    - name: Upload Coverage to Codecov (optional)
      if: success()
      uses: codecov/codecov-action@v5
      with:
        files: ./coverage.xml
        fail_ci_if_error: false
      continue-on-error: true
