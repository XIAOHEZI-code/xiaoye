name: Xiaoye CI

on:
  push:
    branches: [ "master", "main", "feat/*" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  backend-test:
    name: Backend Pytest & Coverage
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11" # 依据你的环境可调整为 3.12
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        # 安装项目主依赖
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        # 安装测试专用依赖
        pip install pytest pytest-asyncio pytest-cov

    - name: Run Pytest with Coverage
      env:
        # 在这里配置 Mock 环境变量，防止测试时报错
        QWEN_API_KEY: "mock_api_key_for_test"
        QWEN_BASE_URL: "http://localhost:8000"
        CELERY_BROKER_URL: "redis://localhost:6379/0"
        PYTHONPATH: ${{ github.workspace }}
      run: |
        # 运行测试并生成终端 coverage 报告和 xml 格式报告
        # 如果测试覆盖率低于 80%，CI 将会报错截断 (--cov-fail-under=80 可以日后开启)
        pytest tests/ --cov=src --cov-report=term-missing --cov-report=xml -v

