[pytest]
# ── 测试金字塔标记注册 ──
# Small:  纯 Mock 单元测试（无外部依赖，秒级）
# Medium: 集成测试（需 ES/Redis，可优雅跳过）
# Large:  端到端测试（需真实 LLM，默认跳过，需 RUN_E2E=true）
markers =
    small: 纯 Mock 单元测试（无外部依赖）
    medium: 集成测试（需要外部服务如 ES/Redis）
    large: 端到端沙盒测试（需真实 LLM 调用）
    e2e: 端到端测试（消耗真实 LLM Token，默认跳过）
    integration: 集成测试（需外部服务）
    asyncio: 异步测试

# 测试发现路径
testpaths = tests

# 异步测试模式
asyncio_mode = auto

# 默认选项
addopts = -v --tb=short --strict-markers

# CI 环境下跳过标记为 e2e 的测试（双重保险）
# 本地开发时：RUN_E2E=true pytest tests/ -v
